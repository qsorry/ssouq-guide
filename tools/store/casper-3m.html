<!doctype html>
<!-- غلاف باقتي كاسبر 3 أشهر في المتجر (1000×1000) على تصميم غلاف باقتي سامسونج و LG (6 أشهر وسنة):
     ?v=webos لباقة شاشات سامسونج و LG، وبلا معامل للباقة العادية (أندرويد · آيفون · كمبيوتر).
     يُصوَّر بمتصفح بهذا المقاس ثم يُحفظ JPG في static/img/products/casper-3m.jpg و casper-3m-webos.jpg،
     ويأخذه المتجر من jsDelivr برقم الـ commit. --><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-arabic-500-normal.woff2) format("woff2"),url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Plex;src:url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2"),url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-latin-700-normal.woff2) format("woff2");font-weight:700}
@font-face{font-family:Kufi;src:url(https://cdn.jsdelivr.net/npm/@fontsource/noto-kufi-arabic@5/files/noto-kufi-arabic-arabic-800-normal.woff2) format("woff2");font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1000px;height:1000px;overflow:hidden}
body{font-family:Plex,sans-serif;color:#fff;position:relative;background:#0b0f1f}
.bg{position:absolute;inset:0;
  background:radial-gradient(620px 520px at 88% 6%,rgba(150,24,30,.55),transparent 70%),
             radial-gradient(640px 560px at 4% 98%,rgba(30,64,175,.55),transparent 70%),
             linear-gradient(160deg,#121735 0%,#0b0f1f 55%,#0c1430 100%)}
.card{position:absolute;inset:28px;border:1.5px solid rgba(255,255,255,.09);border-radius:44px}
.logo{position:absolute;left:50%;top:78px;width:320px;height:320px;margin-left:-160px;border-radius:68px;overflow:hidden;
  box-shadow:0 0 90px rgba(220,38,38,.45),0 18px 40px rgba(0,0,0,.5)}
.logo img{width:100%;height:100%;display:block;transform:scale(1.07)}
.chips{position:absolute;top:436px;left:0;right:0;display:flex;justify-content:center;gap:18px;direction:ltr}
.chip{height:64px;padding:0 24px;display:flex;align-items:center;gap:10px;border-radius:14px;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);font-size:30px;font-weight:700;color:#fff}
.chip.sam{font-family:Arial Black,Arial,sans-serif;letter-spacing:3px;font-size:27px}
.chip.lg i{width:34px;height:34px;border-radius:50%;background:#c8102e;display:inline-flex;align-items:center;justify-content:center;
  font-style:normal;font-size:15px;font-weight:700;color:#fff}
.chip.web{font-weight:500}.chip.web b{color:#f0567a;font-weight:500}
h1{position:absolute;top:526px;left:0;right:0;text-align:center;font-family:Kufi,Plex,sans-serif;font-weight:800;font-size:60px;line-height:1.3}
h1 em{font-style:normal;color:#f6c344}
.site{position:absolute;top:618px;left:0;right:0;text-align:center;font-size:25px;letter-spacing:7px;color:#9aa6c8;direction:ltr}
.stats{position:absolute;top:680px;left:66px;right:66px;display:flex;gap:26px}
.stat{flex:1;height:132px;border-radius:24px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.10);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.stat b{font-size:40px;font-weight:700;direction:ltr}
.stat span{font-size:23px;color:#aeb7d4;font-weight:500}
.q{position:absolute;top:866px;left:0;right:0;text-align:center;font-size:23px;font-weight:700;color:#dfe5f7;direction:ltr;word-spacing:4px}
</style></head><body>
<div class="bg"></div><div class="card"></div>
<div class="logo"><img src="../../static/img/brands/casper.webp" alt=""></div>
<div class="chips" id="chips"></div>
<h1>اشتراك كاسبر لمدة <em>3 أشهر</em></h1>
<div class="site">SSOUQ.COM</div>
<div class="stats">
  <div class="stat"><b>+7,300</b><span>فيلم</span></div>
  <div class="stat"><b>+2,300</b><span>مسلسل</span></div>
  <div class="stat" id="app"></div>
</div>
<div class="q">4K &nbsp;•&nbsp; FHD &nbsp;•&nbsp; HD</div>
<script>
const webos = new URLSearchParams(location.search).get('v') === 'webos';
document.getElementById('chips').innerHTML = webos
  ? '<div class="chip sam">SAMSUNG</div><div class="chip lg"><i>LG</i>LG</div><div class="chip web">web<b>OS</b></div>'
  : '<div class="chip">Android</div><div class="chip">iPhone</div><div class="chip">PC · Mac</div>';
document.getElementById('app').innerHTML = webos
  ? '<b>0Player</b><span>أو Duplecast</span>'
  : '<b>CASPER VIP</b><span>أو Smarters Pro</span>';
</script>
</body></html>
