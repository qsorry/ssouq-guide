<!doctype html>
<!-- بنر «خصم 30% على باقات سمارت · NEW30» لعارض الصور أعلى رئيسية المتجر (1440×556، كبقية البنرات).
     يُصوَّر بمتصفح بهذا المقاس ثم يُحفظ WebP في static/img/store/smart-new30.webp، ويأخذه المتجر من jsDelivr برقم الـ commit. --><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;src:url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-arabic-400-normal.woff2) format("woff2"),url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Plex;src:url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-arabic-600-normal.woff2) format("woff2"),url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Plex;src:url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-arabic-700-normal.woff2) format("woff2"),url(https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-sans-arabic@5/files/ibm-plex-sans-arabic-latin-700-normal.woff2) format("woff2");font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:556px;overflow:hidden}
body{font-family:Plex,sans-serif;color:#fff;position:relative;
  background:linear-gradient(200deg,#1479ad 0%,#0a5a88 38%,#063f63 70%,#042c47 100%)}
body:before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 1px,transparent 1px 38px)}
body:after{content:"";position:absolute;width:620px;height:620px;right:-120px;top:-260px;border-radius:50%;
  background:radial-gradient(circle,rgba(120,200,240,.20),transparent 65%)}
.text{position:absolute;right:74px;top:62px;width:700px;z-index:2}
.pill{display:inline-block;padding:7px 20px;border:1.5px solid rgba(255,255,255,.35);border-radius:999px;
  background:rgba(255,255,255,.08);font-size:22px;color:#e6f2f9}
h1{font-size:76px;line-height:1.16;font-weight:700;margin-top:18px;letter-spacing:-.5px}
h1 .g{color:#EDB44E}
.sub{font-size:25px;color:#d3e6f1;margin-top:14px}
.row{display:flex;gap:18px;align-items:center;margin-top:30px}
.code{display:flex;align-items:center;gap:16px;height:84px;padding:0 26px;border:3px dashed #EDB44E;border-radius:18px;
  background:rgba(4,34,55,.55)}
.code small{font-size:21px;color:#d3e6f1;font-weight:600}
.code b{font-size:46px;font-weight:700;color:#fff;letter-spacing:5px;direction:ltr}
.btn{height:84px;padding:0 40px;display:flex;align-items:center;border-radius:18px;background:#EDB44E;color:#10202b;
  font-size:28px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.art{position:absolute;left:118px;top:118px;z-index:2}
.tv{position:absolute;left:0;top:44px;width:360px;height:236px;border:7px solid #3f93bf;border-radius:20px;background:#0b2d44;
  box-shadow:0 20px 40px rgba(0,0,0,.28)}
.tv i{position:absolute;inset:16px;border-radius:10px;background:#0f3a57}
.tv .l1,.tv .l2{position:absolute;right:40px;height:10px;border-radius:5px;background:#3b6f8f}
.tv .l1{top:40px;width:150px}.tv .l2{top:62px;width:100px}
.tv .play{position:absolute;left:150px;top:78px;width:0;height:0;border-top:40px solid transparent;border-bottom:40px solid transparent;border-left:62px solid #EDB44E}
.neck{position:absolute;left:147px;top:282px;width:66px;height:36px;background:#2f6f93}
.foot{position:absolute;left:100px;top:314px;width:160px;height:16px;border-radius:8px;background:#3f93bf}
.badge{position:absolute;left:260px;top:-6px;width:156px;height:156px;border-radius:50%;background:#EDB44E;color:#10202b;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 26px rgba(0,0,0,.28);border:6px solid #f6d58f}
.badge b{font-size:54px;line-height:1;font-weight:700}
.badge small{font-size:22px;font-weight:700;margin-top:4px}
.tag{position:absolute;left:-26px;top:230px;transform:rotate(-8deg);display:flex;align-items:center;gap:10px;
  background:#fff;color:#0b2d44;border-radius:12px;padding:10px 18px 10px 14px;box-shadow:0 12px 24px rgba(0,0,0,.3);font-weight:700}
.tag:before{content:"";width:14px;height:14px;border-radius:50%;background:#0a5a88}
.tag span{font-size:30px;letter-spacing:3px;direction:ltr}
</style></head><body>
<div class="text">
  <span class="pill">عرض لأول طلب · باقات سمارت</span>
  <h1>خصم <bdi class="g" dir="ltr">30%</bdi> على<br>باقات سمارت</h1>
  <p class="sub">انسخ الكود واكتبه في «عندك كوبون خصم؟» بصفحة الدفع</p>
  <div class="row">
    <div class="code"><small>كود الخصم</small><b>NEW30</b></div>
    <div class="btn">تصفّح الباقات</div>
  </div>
</div>
<div class="art">
  <div class="tv"><i></i><span class="l1"></span><span class="l2"></span><span class="play"></span></div>
  <div class="neck"></div><div class="foot"></div>
  <div class="badge"><b>30%</b><small>خصم</small></div>
  <div class="tag"><span>NEW30</span></div>
</div>
</body></html>
