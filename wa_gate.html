<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>واتساب الطلبات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16324F;--paper:#EEF2F6;--card:#FFFFFF;--line:#D5DEE8;--go:#0F8C7B;--err:#C2412D;--mute:#5F7288}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E3ECF5;--paper:#0E1A26;--card:#162635;--line:#284055;--go:#23B39F;--err:#EF6A55;--mute:#8FA3B8}}
:root[data-theme="dark"]{--ink:#E3ECF5;--paper:#0E1A26;--card:#162635;--line:#284055;--go:#23B39F;--err:#EF6A55;--mute:#8FA3B8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif}
main{max-width:420px;margin:0 auto;padding:40px 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{font-size:1.4rem;margin:0 0 6px}
p{color:var(--mute);margin:0 0 16px;font-size:.95rem}
label{display:block;font-size:.8rem;color:var(--mute);margin-top:10px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;direction:ltr}
button{width:100%;margin-top:16px;padding:14px;background:var(--go);color:#fff;font:inherit;font-weight:700;border:0;border-radius:10px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.msg{color:var(--err);margin-top:10px;font-size:.9rem;min-height:1.4em}
</style>
</head>
<body>
<main><section>
  <h1 id="h">واتساب الطلبات</h1>
  <p id="lead">جارٍ الفحص…</p>
  <div id="form" hidden>
    <label for="p" id="plab">كلمة المرور</label><input id="p" type="password" autocomplete="current-password">
    <div id="c2wrap" hidden><label for="p2">أعد كتابتها</label><input id="p2" type="password" autocomplete="new-password"></div>
    <button id="go">دخول</button>
  </div>
  <div class="msg" id="msg"></div>
</section></main>
<script>
const $ = id => document.getElementById(id);
let setup = false;

async function boot(){
  try {
    const d = await (await fetch("/whatsapp/api/state")).json();
    setup = !!d.setup;
  } catch(e) { $("msg").textContent = "تعذّر الوصول للخادم"; return; }
  $("h").textContent = setup ? "الإعداد الأول" : "واتساب الطلبات";
  $("lead").textContent = setup
    ? "ضع كلمة مرور هذه الصفحة. تُطلب في كل دخول، ولا علاقة لها بكلمة مرور /admin."
    : "هذه الصفحة محمية. ادخل بكلمة مرورها.";
  $("plab").textContent = setup ? "كلمة مرور جديدة (٦ أحرف فأكثر)" : "كلمة المرور";
  $("p").autocomplete = setup ? "new-password" : "current-password";
  $("c2wrap").hidden = !setup;
  $("go").textContent = setup ? "حفظ والدخول" : "دخول";
  $("form").hidden = false;
  $("p").focus();
}

async function go(){
  $("msg").textContent = "";
  if (setup && $("p").value !== $("p2").value) { $("msg").textContent = "الكلمتان غير متطابقتين"; return; }
  try {
    const r = await fetch(setup ? "/whatsapp/api/setup" : "/whatsapp/api/login", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password: $("p").value})});
    const d = await r.json(); if (d.error) throw new Error(d.error);
    location.href = "/whatsapp";
  } catch(e) { $("msg").textContent = e.message; }
}

$("go").onclick = go;
for (const id of ["p","p2"]) $(id).addEventListener("keydown", e => { if (e.key === "Enter") go(); });
boot();
</script>
</body>
</html>
