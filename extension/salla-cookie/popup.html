<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>جلسة سلة</title>
  <style>
    :root {
      --bg: #ffffff; --fg: #14181f; --muted: #5b6472;
      --card: #f4f6fa; --line: #dce1e9; --brand: #1f6feb; --brand-fg: #fff;
      --ok: #1a7f37; --err: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#161a20; --fg:#eef1f6; --muted:#9aa3b2; --card:#1e242c;
              --line:#2b323c; --brand:#3b82f6; }
    }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; padding: 14px;
           font: 14px/1.5 -apple-system, "Segoe UI", Tahoma, sans-serif;
           background: var(--bg); color: var(--fg); }
    h1 { font-size: 15px; margin: 0 0 2px; }
    .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
    button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line);
             background: var(--card); color: var(--fg); padding: 9px 12px; width: 100%; }
    button.primary { background: var(--brand); color: var(--brand-fg); border-color: var(--brand);
                     font-weight: 600; }
    button:disabled { opacity: .55; cursor: default; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    .row button { width: auto; flex: 1; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
    input { width: 100%; font: inherit; padding: 8px; border-radius: 8px;
            border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
    details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
    summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .msg { margin-top: 10px; font-size: 13px; min-height: 18px; white-space: pre-wrap; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--err); }
    .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
    textarea { width: 100%; height: 54px; font: 11px/1.4 monospace; margin-top: 8px;
               border-radius: 8px; border: 1px solid var(--line); background: var(--bg);
               color: var(--fg); padding: 6px; resize: vertical; display: none; }
  </style>
</head>
<body>
  <h1>جلسة لوحة سلة</h1>
  <p class="sub">التقط كوكيز <b>s.salla.sa</b> وأرسلها إلى أداة التجديد بنقرة.</p>

  <button id="send" class="primary">التقاط وإرسال إلى الأداة</button>
  <div class="row">
    <button id="grab">نسخ الترويسة فقط</button>
    <button id="test">التقاط + اختبار</button>
  </div>

  <p class="msg" id="msg"></p>
  <textarea id="out" readonly placeholder="ترويسة الكوكيز تظهر هنا للنسخ اليدوي"></textarea>

  <details id="cfg">
    <summary>إعدادات الأداة</summary>
    <label for="base">عنوان الأداة</label>
    <input id="base" placeholder="https://admin.ssouq.com" autocomplete="off">
    <label for="user">اسم الدخول</label>
    <input id="user" placeholder="admin" autocomplete="off">
    <label for="pass">كلمة المرور</label>
    <input id="pass" type="password" placeholder="كلمة مرور الدخول للأداة" autocomplete="off">
    <button id="save" style="margin-top:10px">حفظ الإعدادات</button>
    <p class="hint">تُحفظ محليًا في المتصفّح فقط، وتُستخدم للمصادقة على الأداة (Basic).</p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
