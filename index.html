  $("#view").innerHTML = `<div class="card done"><div class="big">🎉</div><h2>استمتع بالمشاهدة!</h2><p class="sub">إذا لم تعمل القنوات تأكد من كتابة البيانات بدون مسافات، وأعد تشغيل التطبيق.</p>
    ${(d.doneImgs && d.doneImgs[state.variant]) ? `<img src="${d.doneImgs[state.variant]}" alt="" style="width:100%;border-radius:12px;margin:10px 0">` : ""}
    <div class="nav"><a class="btn wa" href="${WA + encodeURIComponent(d.name)}" target="_blank" rel="noopener">واجهت مشكلة؟ تواصل معنا</a></div>
    <div class="nav"><button class="btn ghost" data-home style="flex:1">تفعيل جهاز آخر</button></div></div>`;
}
function render(){
  if (!state.dev) return renderHome();
  const d = DEVICES[state.dev];
  if (d.variants && !state.variant) return renderChoose();
  if (state.i >= steps().length) return renderDone();
  renderStep();
}
$("#view").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.dev) { state.dev = b.dataset.dev; state.variant = null; state.i = 0; }
  else if (b.dataset.variant) { state.variant = b.dataset.variant; state.i = 0; }
  else if (b.hasAttribute("data-next")) { state.i++; }
  else if (b.hasAttribute("data-back")) {
    if (state.i > 0) state.i--;
    else if (state.variant) state.variant = null;
    else state.dev = null;
  }
  else if (b.hasAttribute("data-home")) { state.dev = null; state.variant = null; state.i = 0; }
  history.replaceState(null, "", state.dev ? "#" + state.dev + (state.variant ? "-" + state.variant : "") : location.pathname);
  render(); go();
});
// deep link: #ios / #android-next / #android-smarters / #tv-mr7 / #tv-smarters / #webos-zero / #webos-ora
const h = location.hash.slice(1).split("-");
if (DEVICES[h[0]]) { state.dev = h[0]; if (h[1] && DEVICES[h[0]].variants?.[h[1]]) state.variant = h[1]; }
render();
</script>
</body>
