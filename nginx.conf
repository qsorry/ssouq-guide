server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml application/xml text/plain;
    location = /iptv-guide { return 301 /; }
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable"; try_files $uri =404; }
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; default_type application/xml; }
    location / { add_header Cache-Control "no-cache"; try_files $uri /index.html; }
}
