<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16324F;--paper:#EEF2F6;--card:#FFFFFF;--line:#D5DEE8;--go:#0F8C7B;--err:#C2412D;--mute:#5F7288}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E3ECF5;--paper:#0E1A26;--card:#162635;--line:#284055;--go:#23B39F;--err:#EF6A55;--mute:#8FA3B8}}
:root[data-theme="dark"]{--ink:#E3ECF5;--paper:#0E1A26;--card:#162635;--line:#284055;--go:#23B39F;--err:#EF6A55;--mute:#8FA3B8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif}
main{max-width:420px;margin:0 auto;padding:40px 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
h1{font-size:1.4rem;margin:0 0 6px}
p{color:var(--mute);margin:0 0 16px;font-size:.95rem}
label{display:block;font-size:.8rem;color:var(--mute);margin-top:10px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;direction:ltr}
button{width:100%;margin-top:16px;padding:14px;background:var(--go);color:#fff;font:inherit;font-weight:700;border:0;border-radius:10px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.msg{color:var(--err);margin-top:10px;font-size:.9rem;min-height:1.4em}
</style>
</head>
<body>
<main><section>
  <h1>تسجيل الدخول</h1>
  <p>ادخل ببيانات حسابك. المدير يدخل باسم <b dir="ltr">admin</b>.</p>
  <!-- نموذجٌ حقيقيّ بحقولٍ مسمّاة (name) + autocomplete + إرسالٍ حقيقي: شرطُ كروم
       لعرض «حفظ كلمة المرور»؛ ومع Credential Management API يُطلب الحفظ صراحةً. -->
  <form id="f" method="post" action="api/login" autocomplete="on">
    <label for="u">اسم الدخول</label>
    <input id="u" name="username" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label for="p">كلمة المرور</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">دخول</button>
  </form>
  <div class="msg" id="msg"></div>
</section></main>
<script>
// الأداة تُقدَّم من الجذر على نطاقها (admin.ssouq.com) وتحت /admin على الموقع العام،
// فتُبنى كل عناوينها على B بدل تثبيت "/admin" في كل نداء.
const B = location.pathname.startsWith("/admin") ? "/admin" : "";
const HOME = B || "/";
const $ = id => document.getElementById(id);
async function go(){
  $("msg").textContent = "";
  const user = $("u").value.trim(), password = $("p").value;
  const btn = $("go"); btn.disabled = true;
  try {
    const r = await fetch(B + "/api/login", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({user, password})});
    const d = await r.json(); if (d.error) throw new Error(d.error);
    // اطلب من المتصفح حفظ البيانات صراحةً (يعمل في كروم على HTTPS)، ثم انتقل.
    try {
      if (window.PasswordCredential) {
        const cred = new PasswordCredential({id: user, password, name: user});
        await navigator.credentials.store(cred);
      }
    } catch (e) { /* المتصفح قد يرفض بصمت — لا يؤثّر على الدخول */ }
    location.href = d.role === "admin" ? B + "/accounts" : HOME;
  } catch(e) { btn.disabled = false; $("msg").textContent = e.message; }
}
// الإرسال عبر submit الحقيقي (لا مجرّد نقرة): كروم يلتقط بيانات الدخول عند الإرسال.
$("f").addEventListener("submit", e => { e.preventDefault(); go(); });
</script>
</body>
</html>
