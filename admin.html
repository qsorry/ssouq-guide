<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة الحسابات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ink:#16324F;--paper:#EEF2F6;--card:#FFFFFF;--line:#D5DEE8;--go:#0F8C7B;--copy:#D9912B;--err:#C2412D;--mute:#5F7288}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E3ECF5;--paper:#0E1A26;--card:#162635;--line:#284055;--go:#23B39F;--copy:#EAA744;--err:#EF6A55;--mute:#8FA3B8}}
:root[data-theme="dark"]{--ink:#E3ECF5;--paper:#0E1A26;--card:#162635;--line:#284055;--go:#23B39F;--copy:#EAA744;--err:#EF6A55;--mute:#8FA3B8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",Tahoma,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:.95rem}
.sub a{color:var(--go)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:1.05rem;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
label{display:block;font-size:.8rem;color:var(--mute);margin-top:10px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;direction:ltr;text-align:left}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
@media (max-width:480px){.g2{grid-template-columns:1fr}}
button{font:inherit;border:0;border-radius:10px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--copy);outline-offset:2px}
.go{width:100%;margin-top:14px;padding:13px;background:var(--go);color:#fff;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 12px;font-size:.85rem}
.danger{background:transparent;border:1px solid var(--err);color:var(--err);padding:6px 12px;font-size:.85rem}
.msg{font-size:.9rem;margin-top:10px;min-height:1.4em;white-space:pre-wrap}
.msg.err{color:var(--err)} .msg.ok{color:var(--go)}
.acct{border-top:1px dashed var(--line);padding:12px 0;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.acct .i{flex:1;min-width:200px}
.acct b{display:block}
.acct code{direction:ltr;display:block;font:500 .78rem/1.6 "IBM Plex Mono",Consolas,monospace;color:var(--mute);overflow-wrap:anywhere}
.acct .b{display:flex;gap:6px}
.empty{color:var(--mute);text-align:center;padding:10px}
</style>
</head>
<body>
<main>
  <h1>إدارة الحسابات</h1>
  <p class="sub">كل حساب له اسم دخول وكلمة مرور و API وهوست مستقل. المستخدم يدخل على <a href="/admin">صفحة الإنشاء</a> ببياناته ويرى باقات الـ API الخاص به فقط. · <a href="/admin/logout">تسجيل الخروج</a></p>

  <section>
    <h2 id="formTitle">إضافة حساب</h2>
    <input type="hidden" id="id">
    <label for="name">اسم الحساب (يظهر في الصفحة)</label><input id="name" placeholder="مثال: Server 1">
    <div class="g2">
      <div><label for="user">اسم الدخول</label><input id="user" autocomplete="off" placeholder="user1"></div>
      <div><label for="password">كلمة المرور</label><input id="password" autocomplete="new-password" placeholder="4 أحرف على الأقل"></div>
    </div>
    <label for="api_url">رابط API الكامل</label><input id="api_url" placeholder="http://server:80/xxx/reseller/index.php">
    <label for="api_key">مفتاح API</label><input id="api_key" autocomplete="off">
    <label for="host">الهوست الافتراضي (يظهر للعميل في السطر)</label><input id="host" placeholder="https://mrha.ink:80">
    <button class="go" id="save">حفظ الحساب</button>
    <button class="ghost" id="cancel" hidden style="width:100%;margin-top:8px">إلغاء التعديل</button>
    <div class="msg" id="msg"></div>
  </section>

  <section>
    <h2>الحسابات <span><button class="ghost" id="exp">تصدير</button> <button class="ghost" id="imp">استيراد</button><input type="file" id="file" accept="application/json" hidden></span></h2>
    <div id="list"><div class="empty">جاري التحميل…</div></div>
  </section>

  <section>
    <h2>كلمة مرور المدير</h2>
    <label for="apw">كلمة مرور جديدة (6 أحرف على الأقل)</label><input id="apw" type="password" autocomplete="new-password">
    <button class="go" id="apwBtn">تغيير</button>
    <div class="msg" id="apwMsg"></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const chk = d => { if (d && d.login) location.href = "/admin/login"; return d; };
const F = ["name","user","password","api_url","api_key","host"];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let accounts = [];

function say(el, t, ok){ el.textContent = t; el.className = "msg " + (ok ? "ok" : "err"); }
async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const d = chk(await r.json()); if (d.error) throw new Error(d.error); return d;
}
async function load(){
  try { const r = await fetch("/admin/api/accounts"); const d = chk(await r.json()); if (d.error) throw new Error(d.error); accounts = d.accounts; }
  catch(e) { $("list").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  render();
}
function render(){
  $("list").innerHTML = accounts.length ? accounts.map(a => `
    <div class="acct"><div class="i"><b>${esc(a.name)}</b>
      <code>login: ${esc(a.user)} / ${esc(a.password)}</code>
      <code>api: ${esc(a.api_url)}</code>
      <code>host: ${esc(a.host)}</code></div>
      <div class="b"><button class="ghost" data-edit="${a.id}">تعديل</button><button class="danger" data-del="${a.id}">حذف</button></div></div>`).join("")
    : '<div class="empty">لا توجد حسابات بعد. أضف أول حساب من النموذج أعلاه.</div>';
}
function fill(a){ $("id").value = a?.id || ""; F.forEach(k => $(k).value = a?.[k] || ""); $("formTitle").textContent = a ? "تعديل: " + a.name : "إضافة حساب"; $("cancel").hidden = !a; }

$("save").onclick = async () => {
  const body = {id: $("id").value}; F.forEach(k => body[k] = $(k).value);
  try { const d = await post("/admin/api/accounts", body); accounts = d.accounts; render(); fill(null); say($("msg"), "تم الحفظ", true); }
  catch(e) { say($("msg"), e.message); }
};
$("cancel").onclick = () => fill(null);
$("list").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.edit) { fill(accounts.find(a => a.id === b.dataset.edit)); window.scrollTo({top:0}); }
  if (b.dataset.del) {
    const a = accounts.find(x => x.id === b.dataset.del);
    if (!confirm(`حذف الحساب "${a.name}"؟`)) return;
    try { const d = await post("/admin/api/accounts/delete", {id: a.id}); accounts = d.accounts; render(); } catch(err) { alert(err.message); }
  }
};
$("exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({accounts}, null, 2)], {type:"application/json"}));
  a.download = "xm_accounts.json"; a.click();
};
$("imp").onclick = () => $("file").click();
$("file").onchange = async () => {
  const f = $("file").files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!confirm("الاستيراد يستبدل كل الحسابات الحالية. متابعة؟")) return;
    const r = await post("/admin/api/accounts/import", {accounts: d.accounts || d}); accounts = r.accounts; render(); say($("msg"), "تم الاستيراد", true);
  } catch(e) { say($("msg"), e.message); }
  $("file").value = "";
};
$("apwBtn").onclick = async () => {
  try { await post("/admin/api/accounts/admin-password", {password: $("apw").value}); $("apw").value = ""; say($("apwMsg"), "تم التغيير. سيطلب المتصفح الدخول من جديد.", true); }
  catch(e) { say($("apwMsg"), e.message); }
};
load();
</script>
</body>
</html>
